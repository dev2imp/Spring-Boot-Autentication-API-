services:
  postgres-db:
    image: postgres:16-alpine
    container_name: spring_boot_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
